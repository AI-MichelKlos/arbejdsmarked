<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>OG-billede | Arbejdsmarkedet i tal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: #0F2B36;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .canvas {
      position: relative;
      display: flex;
      width: 1200px;
      height: 630px;
      padding: 82px 92px 68px;
      flex-direction: column;
    }

    .eyebrow {
      margin: 0;
      color: #BFD4C4;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .rule {
      width: 132px;
      height: 5px;
      margin-top: 30px;
      background: #6B9E78;
    }

    h1 {
      max-width: 970px;
      margin: 52px 0 0;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 82px;
      font-weight: 600;
      line-height: 1.04;
      letter-spacing: -.025em;
    }

    .byline {
      margin: auto 0 0;
      color: #D7E1DD;
      font-size: 24px;
      font-weight: 650;
    }

    .byline strong { color: #FFFFFF; }
  </style>
</head>
<body>
  <main class="canvas">
    <p class="eyebrow">Arbejdsmarkedet i tal</p>
    <div class="rule" aria-hidden="true"></div>
    <!-- UDSKIFT TITELTEKSTEN HER FOR HVER SIDE -->
    <h1>Arbejdsmarkedet i tal</h1>
    <p class="byline">Udarbejdet af <strong>Michel Klos</strong></p>
  </main>
</body>
</html>
